<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" font-family="Noto Sans TC, Microsoft JhengHei, WenQuanYi Zen Hei, sans-serif">
<style>
.wall{fill:none;stroke:#191922;stroke-width:6}
.thin{fill:none;stroke:#191922;stroke-width:2}
.dash{fill:none;stroke:#b5372a;stroke-width:2.5;stroke-dasharray:7 5}
.fill{fill:#e8e2d4;stroke:#191922;stroke-width:2}
.seat{fill:#fff;stroke:#191922;stroke-width:1.5}
.lbl{font-size:15px;fill:#191922}
.sm{font-size:12px;fill:#5a5a63}
.red{font-size:13px;fill:#b5372a;font-weight:bold}
.dim{font-size:12px;fill:#8a8a93}
</style>
<rect x="0" y="0" width="900" height="680" fill="#f6f2e9"/>
<text x="40" y="42" class="lbl" font-size="20" font-weight="bold">岸邊・二樓平面（比例草圖　1 格＝50 cm）v5</text>
<text x="40" y="64" class="sm">實坪約 8.4 坪（27.7 m²）｜前廳 6.9m × 3.4m ＋ 短走道 ＋ 整理間 2.2m × 1.8m｜吧台八席</text>

<!-- 外牆 -->
<rect x="60" y="90" width="690" height="340" class="wall"/>
<line x1="600" y1="90" x2="600" y2="300" class="wall"/>
<line x1="600" y1="360" x2="600" y2="430" class="wall"/>
<rect x="750" y="150" width="90" height="180" class="wall"/>
<line x1="750" y1="330" x2="750" y2="430" class="thin"/>

<!-- 前門・鐵門 -->
<line x1="60" y1="330" x2="60" y2="410" stroke="#f6f2e9" stroke-width="8"/>
<path d="M60 410 A80 80 0 0 0 140 330" class="thin"/>
<line x1="52" y1="330" x2="52" y2="370" stroke="#b5372a" stroke-width="4"/>
<text x="70" y="450" class="lbl">前門・騎樓樓梯</text>
<text x="70" y="468" class="red">鐵門（03:20 拉下一半）</text>

<!-- 長吧台 -->
<rect x="150" y="150" width="440" height="55" class="fill"/>
<text x="260" y="184" class="lbl">長吧台（4.8 m・八席）</text>
<g class="seat">
<circle cx="180" cy="240" r="15"/><circle cx="238" cy="240" r="15"/><circle cx="296" cy="240" r="15"/><circle cx="354" cy="240" r="15"/>
<circle cx="412" cy="240" r="15"/><circle cx="470" cy="240" r="15"/><circle cx="528" cy="240" r="15"/>
</g>
<circle cx="556" cy="290" r="15" fill="#f1d9d4" stroke="#b5372a" stroke-width="2"/>
<text x="150" y="272" class="sm">吧台八席（每席 60 cm）</text>
<text x="536" y="296" class="red" text-anchor="end">魏哥的老位子（最裡面那席）</text>

<!-- 鐵踏階 -->
<line x1="500" y1="212" x2="590" y2="212" stroke="#b5372a" stroke-width="6"/>
<text x="622" y="232" class="red">吧台尾端・鐵踏階</text>
<text x="622" y="250" class="sm">魏哥倒下撞到這裡</text>

<!-- 吧台內工作區 -->
<rect x="150" y="95" width="440" height="50" fill="#dcd5c4" stroke="#191922" stroke-width="1.5"/>
<text x="160" y="116" class="sm">吧台內工作區・家豪收班的位置</text>
<text x="160" y="134" class="sm">洗杯機・製冰機・酒櫃</text>
<!-- 杯架 -->
<g stroke="#191922" stroke-width="1" fill="#fff">
<rect x="500" y="99" width="20" height="13"/><rect x="520" y="99" width="20" height="13"/><rect x="540" y="99" width="20" height="13" fill="#b5372a"/>
<rect x="500" y="112" width="20" height="13"/><rect x="520" y="112" width="20" height="13"/><rect x="540" y="112" width="20" height="13"/>
<rect x="500" y="125" width="20" height="13"/><rect x="520" y="125" width="20" height="13"/><rect x="540" y="125" width="20" height="13"/>
</g>
<text x="492" y="116" class="red" text-anchor="end">杯架右上角 →</text>
<text x="492" y="134" class="sm" text-anchor="end">家豪放最後一個杯子</text>

<!-- 四人桌 -->
<rect x="170" y="330" width="130" height="72" class="fill"/><text x="200" y="372" class="sm">四人桌</text>

<!-- 後方座位・長椅 -->
<rect x="420" y="330" width="150" height="72" class="fill"/>
<rect x="420" y="384" width="150" height="18" fill="#f1d9d4" stroke="#b5372a" stroke-width="2"/>
<text x="432" y="350" class="sm">後方座位（店長的位置）</text>
<text x="432" y="374" class="red">魏哥喝多了睡這張長椅</text>
<text x="432" y="398" class="sm">長椅</text>

<!-- 拖行 -->
<path d="M578 216 C600 260 590 320 560 386" class="dash"/>
<polygon points="560,386 556,372 568,376" fill="#b5372a"/>
<text x="622" y="276" class="red">家豪拖過去</text>
<text x="622" y="292" class="sm">約 1.5 m</text>

<!-- 短走道・整理間 -->
<text x="608" y="104" class="lbl" transform="rotate(90 608 104)">短走道 1.1 m</text>
<line x1="600" y1="300" x2="750" y2="300" class="thin" stroke-dasharray="4 4"/>
<text x="612" y="322" class="sm">洗手間</text>
<text x="762" y="176" class="lbl">整理間</text>
<text x="757" y="196" class="sm">2.2 × 1.8 m</text>
<text x="757" y="216" class="sm">冰塊・備用杯</text>
<text x="757" y="232" class="sm">掛衣區</text>
<line x1="750" y1="150" x2="750" y2="205" stroke="#f6f2e9" stroke-width="8"/>
<path d="M750 205 A55 55 0 0 1 695 150" class="thin"/>

<!-- 比例尺 -->
<line x1="60" y1="500" x2="160" y2="500" class="thin"/>
<line x1="60" y1="494" x2="60" y2="506" class="thin"/><line x1="160" y1="494" x2="160" y2="506" class="thin"/>
<text x="86" y="520" class="dim">1 公尺</text>

<!-- v5 動線 -->
<text x="220" y="500" class="lbl" font-weight="bold">死亡當晚動線（v5・作者用，⛔ 不入正文）</text>
<text x="220" y="522" class="sm">03:05　宇辰等人下班；家豪收班，魏哥照例留下多喝一杯（他有鑰匙，常一個人留到天亮）</text>
<text x="220" y="542" class="sm">約 03:20　信翔回來拿安全帽：鐵門拉下一半、裡面有燈、兩個人在講話，他沒有進去</text>
<text x="220" y="562" class="sm">約 03:25　吧台尾端推擠，魏哥往後倒，頭撞到鐵踏階（非預謀）</text>
<text x="220" y="582" class="sm">03:25–03:50　家豪把魏哥拖上後方長椅、蓋外套；洗魏哥的專屬杯，放杯架右上角；關燈、拉門</text>
<text x="220" y="602" class="sm">隔天 19:00　立航開店，先從右上角拿第一個杯子（魏哥的杯），才看見長椅上的人</text>
<text x="220" y="632" class="red">⚠️ 魏哥 183 cm、家豪 176 cm；從踏階到長椅約一公尺半，一個人拖得動。⛔ 正文不寫拖的過程。</text>
</svg>
